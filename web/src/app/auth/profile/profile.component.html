<div class="page-wrap">
  <div class="profile-card">
    <h2>My Profile</h2>
    <p class="muted">Update your personal account details.</p>

    @if (isLoading()) {
      <div class="info">Loading profile...</div>
    }
    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="success">{{ successMessage() }}</div>
    }

    @if (!isLoading()) {
      <form [formGroup]="profileForm" (ngSubmit)="save()">
        <label>
          Username
          <strong><input formControlName="userName" readonly /></strong>
        </label>
        <label>
          Email
          <input type="email" formControlName="email" />
        </label>
        <div class="row">
          <label class="half">
            First Name
            <input formControlName="firstName" />
          </label>
          <label class="half">
            Last Name
            <input formControlName="lastName" />
          </label>
        </div>
        <label>
          Current Password (required to save)*
          <input type="password" formControlName="currentPassword" autocomplete="current-password" />
        </label>
        <div class="row">
          <label class="half">
            New Password (optional)
            <input type="password" formControlName="newPassword" autocomplete="new-password" />
          </label>
          <label class="half">
            Re-enter New Password
            <input type="password" formControlName="reenterNewPassword" autocomplete="new-password" />
            @if (showPasswordMismatchHint) {
              <small class="field-hint error-hint">New and re-entered passwords do not match.</small>
            }
            @else{<small>&nbsp;</small>}
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" [disabled]="isSaving() || profileForm.get('currentPassword')?.invalid || showPasswordMismatchHint">
            {{ isSaving() ? 'Saving...' : 'Save Profile' }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
