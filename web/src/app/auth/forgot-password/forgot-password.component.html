<div class="auth-page">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="muted">Enter your account email and we will send a reset code.</p>

    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }

    @if (successMessage()) {
      <div class="success">{{ successMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" />
      </label>

      <div class="actions">
        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Sending...' : 'Send Reset Code' }}
        </button>
      </div>
    </form>

    <div class="links">
      <a routerLink="/reset-password">I already have a code</a>
      <a routerLink="/forgot-username" data-testid="forgot-username-link">Forgot username?</a>
      <a routerLink="/login">Back to login</a>
    </div>
  </div>
</div>
