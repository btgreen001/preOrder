<div class="page-wrap">
  <div class="company-card">
    <h2>Company Profile</h2>
    <p class="muted">Company administrators can update organization contact details.</p>

    @if (isLoading()) {
      <div class="info">Loading company profile...</div>
    }
    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="success">{{ successMessage() }}</div>
    }

    @if (!isLoading()) {
      <form [formGroup]="form" (ngSubmit)="save()">
        <label>
          Organization Name
          <input formControlName="organizationName" />
        </label>
        <label>
          Primary Email
          <input type="email" formControlName="primaryEmail" />
        </label>
        <label>
          Contact Phone
          <input formControlName="contactPhone" />
        </label>
        <label>
          Address Line 1
          <input formControlName="addressLine1" />
        </label>
        <label>
          Address Line 2
          <input formControlName="addressLine2" />
        </label>
        <label>
          Address Line 3
          <input formControlName="addressLine3" />
        </label>
        <div class="row">
          <label class="half">
            City
            <input formControlName="locality" />
          </label>
          <label class="half">
            State / Region
            <input formControlName="region" />
          </label>
        </div>
        <div class="row">
          <label class="half">
            Postal Code
            <input formControlName="postalCode" />
          </label>
          <label class="half">
            Country Code
            <input formControlName="countryCode" />
          </label>
        </div>
        <label>
          Current Password (required to save)*
          <input type="password" formControlName="currentPassword" autocomplete="current-password" />
        </label>
        <div class="actions">
          <button type="submit" class="btn-primary" [disabled]="isSaving() || form.get('currentPassword')?.invalid">
            {{ isSaving() ? 'Saving...' : 'Save Company Profile' }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
