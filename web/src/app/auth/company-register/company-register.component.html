<div class="spotify-register-root">

  <div class="register-area">
    <mat-card class="spotify-card">
      <div class="card-header">
        <h2>Register Your Company</h2>
        <p class="muted">Create your company account and an admin user</p>
      </div>

      <form [formGroup]="companyRegisterForm" (ngSubmit)="onSubmit()" class="register-form">
        <div class="section"> 
          <mat-form-field appearance="outline" class="full">
            <mat-label>Company Name</mat-label>
            <input matInput formControlName="companyName" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Company Email</mat-label>
            <input matInput type="email" formControlName="email" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Mailing Address</mat-label>
            <input matInput formControlName="addressLine1" />
          </mat-form-field>
        </div>

        <div class="section">
          <div class="row">
            <mat-form-field appearance="outline" class="half">
              <mat-label>City</mat-label>
              <input matInput formControlName="locality" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="half">
              <mat-label>State / Region</mat-label>
              <input matInput formControlName="region" />
            </mat-form-field>
          </div>
        </div>

        <div class="section">
          <div class="row">
            <mat-form-field appearance="outline" class="half">
              <mat-label>Postal Code</mat-label>
              <input matInput formControlName="postalCode" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="half">
              <mat-label>Country</mat-label>
              <input matInput formControlName="countryCode" />
            </mat-form-field>
          </div>
        </div>

        <div class="section">
          <label class="section-label">Admin Account</label>
          <div class="row">
            <mat-form-field appearance="outline" class="half">
              <mat-label>First Name</mat-label>
              <input matInput formControlName="adminFirstName" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="half">
              <mat-label>Last Name</mat-label>
              <input matInput formControlName="adminLastName" />
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Admin Email</mat-label>
            <input matInput type="email" formControlName="adminEmail" />
          </mat-form-field>

          <div class="row">
            <mat-form-field appearance="outline" class="half">
              <mat-label>Admin Username</mat-label>
              <input matInput formControlName="adminUsername" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="half">
              <mat-label>Admin Password</mat-label>
              <input matInput type="password" formControlName="adminPassword" />
            </mat-form-field>
          </div>  
        </div>

        <button mat-flat-button class="spotify-btn" type="submit" [disabled]="companyRegisterForm.invalid || isLoading">
          <span *ngIf="!isLoading">Register Company</span>
        </button>

        <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
      </form>

      <mat-card-actions class="card-actions">
        <a routerLink="/login">Already registered? Login</a>
        <a routerLink="/register">Have a registration code?</a>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
