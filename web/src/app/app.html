<div class="app-shell">
  <app-loading-overlay></app-loading-overlay>
  <nav class="topnav">
    <mat-icon class="brand-icon">bakery_dining</mat-icon>
    <span class="app-title">BakeAhead™ <small>Powered by BakeBoard™</small></span>
    <span class="spacer"></span>
    <div class="nav-controls" *ngIf="showAdminShell">
      <a
        *ngIf="showStorePreviewLink"
        class="change-user-btn"
        href="/BakeAhead"
        target="_blank"
        rel="noopener noreferrer"
        title="Open Storefront Preview"
        data-testid="storefront-preview-link">
        <mat-icon>open_in_new</mat-icon>
        Preview Store
      </a>
      <button class="logout-btn" (click)="logoutAllSessions()" title="Logout" data-testid="logout-button">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>
  </nav>
  <div class="main-layout">
    <aside class="sidebar" *ngIf="showAdminShell">
      <ul>
        <li *ngFor="let nav of sidebarNav"
            [class.active]="isActive(nav.route)"
            [class.child]="nav.isChild">
          <a [routerLink]="nav.route">
            <mat-icon class="nav-icon">{{ nav.icon }}</mat-icon>
            <span class="nav-label">{{ nav.label }}</span>
          </a>
        </li>
      </ul>
    </aside>
    <main class="main-content">
      <div class="content-scroll">
        <router-outlet></router-outlet>
      </div>
      <div class="copy">© 2000-{{ currentYear }} G&S Blue Collar. All rights reserved. BakeSweet℠ and all related marks are trademarks of G&S Blue Collar.</div>
    </main>
  </div>
</div>
