<div class="app-shell">
  <app-loading-overlay></app-loading-overlay>
  <nav class="topnav">
    <button
      class="mobile-nav-toggle"
      *ngIf="showAdminShell"
      (click)="toggleSidebar()"
      title="Toggle navigation"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="isSidebarOpen"
      aria-controls="primary-sidebar"
    >
      <mat-icon>{{ isSidebarOpen ? 'close' : 'menu' }}</mat-icon>
      
    </button>
    <mat-icon class="brand-icon">bakery_dining</mat-icon>
    <div class="app-title-wrapper">
      <div class="app-title">BakeAhead™</div>
      <div class="tiny">Powered by BakeBoard™</div>
    </div>
    <span class="spacer"></span>
    <div class="nav-controls" *ngIf="showAdminShell">
      <button class="logout-btn" (click)="logoutThisSession()" title="Logout" data-testid="logout-button">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>
  </nav>
  <div
    class="mobile-sidebar-backdrop"
    *ngIf="showAdminShell && isSidebarOpen"
    role="button"
    tabindex="0"
    (click)="closeSidebar()"
    (keydown.enter)="closeSidebar()"
    (keydown.space)="closeSidebar()"
  >
  </div>
  <div class="main-layout">
  <aside id="primary-sidebar" class="sidebar" *ngIf="showAdminShell" [class.mobile-open]="isSidebarOpen">
  <ul>
    <li *ngFor="let nav of sidebarNav"
        [class.active]="nav.route ? isActive(nav.route) : false"
        [class.child]="nav.isChild">

      <!-- Divider BEFORE this item -->
      <div *ngIf="nav.dividerBefore" class="nav-divider"></div>

      <!-- External link -->
      <a *ngIf="nav.externalUrl"
        [href]="nav.label === 'Store Preview' ? storePreviewUrl : nav.externalUrl"
         target="_blank"
         rel="noopener noreferrer">
        <mat-icon>{{ nav.icon }}</mat-icon>
        {{ nav.label }}
      </a>

        <!-- Internal route -->
        <a *ngIf="nav.route && !nav.externalUrl"
          [routerLink]="nav.route">
          <mat-icon>{{ nav.icon }}</mat-icon>
          {{ nav.label }}
        </a>

      </li>
    </ul>
  </aside>


    <main class="main-content">
      <div class="content-scroll">
        <router-outlet></router-outlet>
      </div>
      <div class="copy">© 2000-{{ currentYear }} G&S Blue Collar. All rights reserved. BakeSweet℠ and all related marks are trademarks of G&S Blue Collar.</div>
    </main>
  </div>
</div>
