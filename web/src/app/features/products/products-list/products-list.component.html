<div class="products-container">
  <mat-card class="products-card">
    <mat-card-header>
      <mat-card-title>Products</mat-card-title>
    </mat-card-header>
    <mat-card-actions>
      <button mat-stroked-button color="primary" (click)="openCreateComponentModal()">Create Component Product</button>
    </mat-card-actions>

    <mat-card-content>
      <div *ngIf="isLoading" class="loading-spinner">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Loading products...</p>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
        <button mat-raised-button color="primary" (click)="loadProducts()">Retry</button>
      </div>

      <div *ngIf="!isLoading && products.length === 0 && !errorMessage" class="no-data">
        <p>No products found.</p>
        <button mat-raised-button color="primary">Add Product</button>
      </div>

      <table mat-table [dataSource]="products" *ngIf="!isLoading && products.length > 0" class="products-table">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Product Name</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <!-- SKU Column -->
        <ng-container matColumnDef="sku">
          <th mat-header-cell *matHeaderCellDef>SKU</th>
          <td mat-cell *matCellDef="let element">{{ element.sku }}</td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let element">
            <span class="product-badge component" *ngIf="element.IsRecipeComponent">Component</span>
            <span class="product-badge for-sale" *ngIf="element.isForSale">For Sale</span>
            <span *ngIf="!element.IsRecipeComponent && !element.isForSale">-</span>
          </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">{{ element.description || '-' }}</td>
        </ng-container>

        <!-- Unit Price Column -->
        <ng-container matColumnDef="unitPrice">
          <th mat-header-cell *matHeaderCellDef>Unit Price</th>
          <td mat-cell *matCellDef="let element">${{ element.unitPrice.toFixed(2) }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="warn" (click)="deleteProduct(element.id)" title="Delete">
            <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
