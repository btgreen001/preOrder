<div class="terminal-list-container">
  <div class="header">
    <h2>Terminal Management</h2>
    <button mat-raised-button color="primary" (click)="createTerminal()" data-testid="create-terminal-button">
      <mat-icon>add</mat-icon>
      New Terminal
    </button>
  </div>

  <mat-card *ngIf="errorMessage" class="error-card">
    <mat-card-content>
      <p class="error-message">{{ errorMessage }}</p>
      <button mat-button (click)="retry()" data-testid="retry-button">Retry</button>
    </mat-card-content>
  </mat-card>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Loading terminals...</p>
  </div>

  <div *ngIf="!isLoading && terminals.length === 0" class="empty-state">
    <mat-card>
      <mat-card-content>
        <p>No terminals configured yet.</p>
        <button mat-raised-button color="primary" (click)="createTerminal()">Create First Terminal</button>
      </mat-card-content>
    </mat-card>
  </div>

  <table mat-table [dataSource]="terminals" *ngIf="!isLoading && terminals.length > 0" class="terminal-table" data-testid="terminal-table">
    <!-- Terminal Code Column -->
    <ng-container matColumnDef="terminalCode">
      <th mat-header-cell *matHeaderCellDef>Terminal Code</th>
      <td mat-cell *matCellDef="let terminal">{{ terminal.terminalCode }}</td>
    </ng-container>

    <!-- Location Column -->
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>Location</th>
      <td mat-cell *matCellDef="let terminal">{{ terminal.location }}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let terminal">
        <span [class.status-active]="terminal.isActive" [class.status-inactive]="!terminal.isActive">
          {{ terminal.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
    </ng-container>

    <!-- Created On Column -->
    <ng-container matColumnDef="createdOn">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let terminal">{{ terminal.createdOn | date:'short' }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let terminal">
        <button mat-icon-button (click)="editTerminal(terminal)" title="Edit" data-testid="edit-button">
          <mat-icon>edit</mat-icon>
        </button>
        <button *ngIf="terminal.isActive" 
                mat-icon-button 
                (click)="deactivateTerminal(terminal)" 
                title="Deactivate"
                data-testid="deactivate-button">
          <mat-icon>power_off</mat-icon>
        </button>
        <button *ngIf="!terminal.isActive" 
                mat-icon-button 
                (click)="reactivateTerminal(terminal)" 
                title="Reactivate"
                data-testid="reactivate-button">
          <mat-icon>power_settings_new</mat-icon>
        </button>
        <button mat-icon-button 
                (click)="deleteTerminal(terminal)" 
                title="Delete"
                data-testid="delete-button">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
