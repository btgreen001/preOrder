# fly.toml app configuration file generated for preorder-web on 2026-05-08T11:53:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'preorder-web'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
