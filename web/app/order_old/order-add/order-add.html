<div class="order-add-container">
  <header class="page-header">
    <h1>Create Order</h1>
  </header>
  <form [formGroup]="form" (ngSubmit)="submit()" class="order-form">
    <div class="form-group">
      <label>Customer</label>
      <input formControlName="customer" required />
      @if (form.get('customer')?.invalid && form.get('customer')?.touched) {
        <small class="error">Customer is required</small>
      }
    </div>
    <div class="form-group">
      <label>Items (mock)</label>
      <textarea formControlName="items" placeholder="e.g., Croissant x2, Baguette x1"></textarea>
    </div>
    <div class="form-group">
      <label>Total</label>
      <input type="number" formControlName="total" min="0" step="0.01" />
    </div>
    <button class="btn-primary" [disabled]="form.invalid || saving" type="submit">{{ saving ? 'Saving...' : 'Create Order' }}</button>
  </form>
</div>
