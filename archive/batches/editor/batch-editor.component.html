<div class="batch-editor-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditing ? 'Edit Batch' : 'Create New Batch' }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="loading" class="loading-spinner">
        <mat-spinner></mat-spinner>
        <p>Loading batch...</p>
      </div>

      <div *ngIf="error" class="error-message">
        <strong>Error:</strong> {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Recipe</mat-label>
          <input 
            matInput 
            formControlName="recipeId"
            placeholder="Enter Recipe ID"
            data-testid="recipe-id-input">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Product</mat-label>
          <input 
            matInput 
            formControlName="productId"
            placeholder="Enter Product ID"
            data-testid="product-id-input">
        </mat-form-field>

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Quantity Produced</mat-label>
            <input 
              matInput 
              type="number"
              formControlName="quantityProduced"
              data-testid="quantity-input">
            <mat-error *ngIf="quantityError">{{ quantityError }}</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Cost Per Unit ($)</mat-label>
            <input 
              matInput 
              type="number"
              step="0.01"
              formControlName="costPerUnit"
              data-testid="cost-input">
            <mat-error *ngIf="costError">{{ costError }}</mat-error>
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Production Date</mat-label>
            <input 
              matInput 
              [matDatepicker]="productionPicker"
              formControlName="productionDate"
              data-testid="production-date-input">
            <mat-datepicker-toggle matSuffix [for]="productionPicker"></mat-datepicker-toggle>
            <mat-datepicker #productionPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Expiration Date</mat-label>
            <input 
              matInput 
              [matDatepicker]="expirationPicker"
              formControlName="expirationDate"
              data-testid="expiration-date-input">
            <mat-datepicker-toggle matSuffix [for]="expirationPicker"></mat-datepicker-toggle>
            <mat-datepicker #expirationPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width" *ngIf="isEditing">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status" data-testid="status-select">
            <mat-option *ngFor="let status of statuses" [value]="status">
              {{ status }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div class="button-group">
          <button 
            mat-raised-button 
            type="submit"
            [disabled]="form.invalid || saving"
            color="primary"
            data-testid="save-batch-btn">
            <mat-icon *ngIf="saving">hourglass_bottom</mat-icon>
            <span *ngIf="!saving">Save Batch</span>
            <span *ngIf="saving">Saving...</span>
          </button>
          <button 
            mat-stroked-button 
            type="button"
            (click)="onCancel()"
            [disabled]="saving"
            data-testid="cancel-batch-btn">
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
