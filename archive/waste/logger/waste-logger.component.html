<div class="waste-logger-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Log Waste Event</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="success" class="success-message">
        <mat-icon>check_circle</mat-icon>
        <span>{{ success }}</span>
      </div>

      <div *ngIf="error" class="error-message">
        <mat-icon>error</mat-icon>
        <span>{{ error }}</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="section-title">Waste Source (Optional - specify one)</div>
        
        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Batch ID</mat-label>
            <input 
              matInput 
              formControlName="batchId"
              placeholder="From batch..."
              data-testid="batch-id-input">
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Inventory Item ID</mat-label>
            <input 
              matInput 
              formControlName="inventoryItemId"
              placeholder="From inventory..."
              data-testid="inventory-item-input">
          </mat-form-field>
        </div>

        <div class="section-title" style="margin-top: 24px;">Waste Details</div>

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Quantity Wasted</mat-label>
            <input 
              matInput 
              type="number"
              step="0.01"
              formControlName="quantityWasted"
              data-testid="quantity-wasted-input">
            <mat-error *ngIf="quantityError">{{ quantityError }}</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Unit</mat-label>
            <input 
              matInput 
              formControlName="unit"
              placeholder="e.g., pieces, pounds"
              data-testid="unit-input">
          </mat-form-field>
        </div>

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Waste Reason</mat-label>
            <mat-select formControlName="wasteReason" data-testid="waste-reason-select">
              <mat-option *ngFor="let reason of wasteReasons" [value]="reason">
                {{ reason }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Waste Cost ($)</mat-label>
            <input 
              matInput 
              type="number"
              step="0.01"
              formControlName="wasteCost"
              data-testid="waste-cost-input">
            <mat-error *ngIf="costError">{{ costError }}</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Notes</mat-label>
          <textarea 
            matInput 
            formControlName="notes"
            rows="4"
            placeholder="Additional details about the waste..."
            data-testid="notes-textarea"></textarea>
        </mat-form-field>

        <div class="button-group">
          <button 
            mat-raised-button 
            type="submit"
            [disabled]="form.invalid || saving"
            color="primary"
            data-testid="log-waste-btn">
            <mat-icon *ngIf="saving">hourglass_bottom</mat-icon>
            <span *ngIf="!saving">Log Waste</span>
            <span *ngIf="saving">Logging...</span>
          </button>
          <button 
            mat-stroked-button 
            type="button"
            (click)="onCancel()"
            [disabled]="saving"
            data-testid="clear-form-btn">
            Clear Form
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
