name: Snyk Open Source Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk-sca:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Install Node for Angular dependency scanning
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install .NET for NuGet scanning
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

  # Install Angular dependencies (if package-lock.json exists)
      - name: Install npm dependencies
        run: npm install
        working-directory: ./web # change if your Angular folder is different
        continue-on-error: true

      # Restore .NET dependencies
      - name: Restore .NET dependencies
        run: dotnet restore
        working-directory: ./api # change if your .NET folder is different
        continue-on-error: true

      # Run Snyk dependency scan for ALL projects
      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects
